global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "users-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "users-service:9065"

  - job_name: "bookings-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "bookings-service:9066"

  - job_name: "hotels-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "hotels-service:9064"

  - job_name: "payments-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "payments-service:9069"
