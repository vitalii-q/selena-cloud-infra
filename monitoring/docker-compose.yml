# This docker-compose file sets up Prometheus and Grafana for monitoring.
# 
# From the repository root, start the application services first:
# docker compose -f docker-compose.yml -f docker-compose.override.yml up -d users-service bookings-service hotels-service
# Then start monitoring:
# docker compose -f infrastructure/monitoring/docker-compose.yml up -d
# Stop monitoring:
# docker compose -f infrastructure/monitoring/docker-compose.yml down

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - app_network

networks:
  app_network:
    external: true
    name: selena-dev_app_network
