# This docker-compose file sets up Prometheus and Grafana for monitoring.
# 
# From the repository root, start only the monitoring services:
# docker compose -f infrastructure/monitoring/docker-compose.yml up -d
# Stop monitoring:
# docker compose -f infrastructure/monitoring/docker-compose.yml down
# A separately launched application container can join the created network with
# --network selena-monitoring --network-alias bookings-service.

version: "3.9"

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=2GB"
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in infrastructure/monitoring/.env}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

networks:
  monitoring:
    name: selena-monitoring

volumes:
  prometheus_data:
    name: selena-dev_prometheus_data
  grafana_data:
    name: selena-dev_grafana_data
